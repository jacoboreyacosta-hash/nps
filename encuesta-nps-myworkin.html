<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta de Satisfacción · Claude Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="style-app">
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F3F6FA;
    --surface-3: #EAEFF5;
    --border: #E2E8F0;
    --ink: #101826;
    --ink-muted: #5B6B80;
    --ink-faint: #8394A8;
    --accent: #0072D6;
    --accent-strong: #0072D6;
    --accent-soft: rgba(0,114,214,0.08);
    --accent-ink: #FFFFFF;
    --on-status: rgba(10,14,20,0.86);
    --on-critical: #FFFFFF;
    --good: #12A578;
    --good-soft: rgba(18,165,120,0.12);
    --warning: #C97A0A;
    --warning-soft: rgba(201,122,10,0.12);
    --critical: #D6304B;
    --critical-soft: rgba(214,48,75,0.10);
    --shadow: rgba(16,24,38,0.08);
    --font-display: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  /* Fondo blanco fijo — sin variante oscura, sin importar el tema del sistema o del visor. */

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  button, input, textarea { font-family: inherit; color: inherit; }

  .page { max-width: 680px; margin: 0 auto; padding: 72px 24px 96px; }

  @media (max-width: 560px) { .page { padding: 48px 16px 64px; } }

  /* ---- elevation ---- */

  .lift-1 { box-shadow: 0 1px 2px rgba(16,24,38,0.04), 0 1px 1px rgba(16,24,38,0.03); }
  .lift-2 { box-shadow: 0 1px 2px rgba(16,24,38,0.04), 0 16px 40px -16px rgba(16,24,38,0.16); }

  /* ---- header ---- */

  .hero-header { position: relative; padding: 4px 0 40px; }
  .hero-header::before {
    content: "";
    position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
    width: 720px; height: 360px;
    background: radial-gradient(ellipse at center, var(--accent-soft) 0%, transparent 68%);
    pointer-events: none; z-index: 0;
  }

  .brand-row { position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: 40px; }

  .brand-mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: var(--ink); }

  .brand-logo { height: 28px; width: 138px; display: block; flex: none; background-image: url("/assets/myworkin-logo.png"); background-size: contain; background-repeat: no-repeat; background-position: left center; }

  h1 { position: relative; margin: 0 0 10px; font-size: clamp(30px, 5vw, 40px); font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; line-height: 1.08; }

  .purpose { position: relative; margin: 0 0 18px; font-size: 16.5px; line-height: 1.6; color: var(--ink-muted); max-width: 46ch; text-wrap: pretty; }

  .session-name {
    position: relative; display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.03em; color: var(--ink-faint);
  }
  .session-name::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--good); flex: none; }

  /* ---- notices ---- */

  .notice {
    display: flex; align-items: flex-start; gap: 12px; padding: 15px 18px; border-radius: 14px;
    font-size: 14px; margin-bottom: 28px; border: 1px solid; line-height: 1.5;
  }
  .notice.good { background: var(--good-soft); border-color: var(--good); color: var(--ink); }
  .notice.warn { background: var(--warning-soft); border-color: var(--warning); color: var(--ink); }
  .notice.err { background: var(--critical-soft); border-color: var(--critical); color: var(--ink); }
  .notice .n-icon { flex: none; font-size: 16px; }

  /* ---- form ---- */

  .section-block { margin-bottom: 40px; }
  .section-block:last-of-type { margin-bottom: 0; }

  .section-eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .section-eyebrow .num {
    display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent); flex: none;
  }
  .section-eyebrow .label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .section-eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .form-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px;
    box-shadow: 0 1px 2px rgba(16,24,38,0.04), 0 20px 48px -24px rgba(16,24,38,0.14);
  }
  @media (max-width: 560px) { .form-card { padding: 24px 20px; } }

  .q-block { margin-bottom: 32px; }
  .q-block:last-of-type { margin-bottom: 0; }

  .q-label { margin: 0 0 5px; font-size: 16px; font-weight: 700; letter-spacing: -0.012em; line-height: 1.4; text-wrap: pretty; }
  .q-hint { margin: 0 0 18px; font-size: 13px; color: var(--ink-muted); }

  .scale-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .scale-btn {
    flex: none; min-width: 44px; height: 44px; padding: 0 4px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink); font-family: var(--font-mono); font-weight: 700; font-size: 14.5px;
    cursor: pointer; transition: transform 0.12s cubic-bezier(.2,.8,.2,1), box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .scale-btn:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 10px -4px rgba(16,24,38,0.18); }
  .scale-btn:active { transform: scale(0.96) translateY(0); }
  .scale-btn[data-sel="true"] { transform: translateY(-1px); }
  .scale-btn[data-sel="true"].zone-good { background: var(--good); border-color: var(--good); color: var(--on-status); box-shadow: 0 6px 16px -6px rgba(18,165,120,0.55); }
  .scale-btn[data-sel="true"].zone-warning { background: var(--warning); border-color: var(--warning); color: var(--on-status); box-shadow: 0 6px 16px -6px rgba(201,122,10,0.5); }
  .scale-btn[data-sel="true"].zone-critical { background: var(--critical); border-color: var(--critical); color: var(--on-critical); box-shadow: 0 6px 16px -6px rgba(214,48,75,0.5); }
  .scale-btn[data-sel="true"].zone-plain { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; box-shadow: 0 6px 16px -6px rgba(0,114,214,0.5); }

  .scale-endcaps { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--ink-faint); }

  textarea.q-textarea {
    width: 100%; min-height: 96px; resize: vertical; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--ink); border-radius: 12px; padding: 13px 15px; font-size: 14.5px; line-height: 1.55;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea.q-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }

  .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 36px; flex-wrap: wrap; }

  .field-error { font-size: 12.5px; color: var(--critical); margin: 0; }

  .btn-submit {
    border: none; background: var(--accent-strong); color: #fff; font-weight: 700; font-size: 14.5px;
    padding: 14px 28px; border-radius: 12px; cursor: pointer;
    box-shadow: 0 10px 24px -10px rgba(0,114,214,0.55);
    transition: transform 0.12s cubic-bezier(.2,.8,.2,1), box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn-submit:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 14px 28px -10px rgba(0,114,214,0.6); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit[disabled] { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }

  /* ---- thank-you ---- */

  .thankyou-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 64px 32px; text-align: center;
    box-shadow: 0 1px 2px rgba(16,24,38,0.04), 0 20px 48px -24px rgba(16,24,38,0.14);
  }
  .thankyou-icon {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px; background: var(--good-soft);
    color: var(--good); display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 8px 20px -8px rgba(18,165,120,0.4);
  }
  .thankyou-title { margin: 0 0 10px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .thankyou-sub { margin: 0 0 26px; font-size: 14.5px; line-height: 1.6; color: var(--ink-muted); max-width: 38ch; margin-left: auto; margin-right: auto; }
  .btn-again {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-muted); font-weight: 600; font-size: 13px;
    padding: 10px 18px; border-radius: 10px; cursor: pointer; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .btn-again:hover { color: var(--ink); border-color: var(--accent); }

  footer.page-footer { padding-top: 24px; border-top: 1px solid var(--border); margin-top: 40px; }
  footer.page-footer p { margin: 0 0 6px; font-size: 12px; color: var(--ink-faint); font-family: var(--font-mono); line-height: 1.6; }
</style>
</head>
<body>

<div id="root"></div>

<script>
(function () {
  var SUPABASE_URL = 'https://bwlvobtbhcjoscinqfhq.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3bHZvYnRiaGNqb3NjaW5xZmhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMDUyNDUsImV4cCI6MjEwMDc4MTI0NX0.FtpV3bxY7V9-ZtNQStscEFfSJzjFJ3iN_3yKBEbqgKU';

  var ui = {
    submitted: false,
    draft: { satisfaction: null, acompanamiento: null, calidad_contenido: null, aplicabilidad: null, aprendizaje: '', caso_uso: '', mejora: '' },
    submitting: false,
    notice: null
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function zoneOf(v) {
    if (v >= 9) return 'good';
    if (v >= 7) return 'warning';
    return 'critical';
  }

  function renderNotice() {
    if (!ui.notice) return '';
    return '<div class="notice ' + esc(ui.notice.kind) + '"><span class="n-icon">' + esc(ui.notice.icon) + '</span><span>' + esc(ui.notice.text) + '</span></div>';
  }

  function renderHeader() {
    return (
      '<header class="hero-header">' +
        '<div class="brand-row"><span class="brand-mark"><span class="brand-logo" role="img" aria-label="MyworkIn"></span></span></div>' +
        '<h1>Encuesta de Satisfacción</h1>' +
        '<p class="purpose">Tu opinión nos ayuda a mejorar cada sesión. Son 4 preguntas rápidas y unas líneas para lo que quieras contarnos — menos de 2 minutos.</p>' +
        '<span class="session-name">Claude Training</span>' +
      '</header>'
    );
  }

  function scaleButtons(name, min, max, zoneFn) {
    var out = '';
    for (var v = min; v <= max; v++) {
      var sel = ui.draft[name] === v;
      var zone = zoneFn ? zoneFn(v) : 'plain';
      out += '<button type="button" class="scale-btn ' + (sel ? 'zone-' + zone : '') + '" data-action="pick" data-field="' + name + '" data-value="' + v + '" data-sel="' + sel + '" aria-pressed="' + sel + '">' + v + '</button>';
    }
    return out;
  }

  function openField(field, label, hint, placeholder, isLast) {
    return (
      '<div class="q-block"' + (isLast ? ' style="margin-bottom:0"' : '') + '>' +
        '<p class="q-label">' + label + '</p>' +
        '<p class="q-hint">' + hint + '</p>' +
        '<textarea class="q-textarea" data-role="open" data-field="' + field + '" maxlength="800" placeholder="' + placeholder + '">' + esc(ui.draft[field]) + '</textarea>' +
      '</div>'
    );
  }

  function renderThankYou() {
    return (
      '<div class="thankyou-card">' +
        '<div class="thankyou-icon">✓</div>' +
        '<p class="thankyou-title">¡Gracias por tu tiempo!</p>' +
        '<p class="thankyou-sub">Tu respuesta quedó registrada y le sirve directamente al equipo de MyworkIn para mejorar la próxima sesión.</p>' +
        '<button type="button" class="btn-again" data-action="again">Enviar otra respuesta</button>' +
      '</div>'
    );
  }

  function renderForm() {
    var canSubmit = ui.draft.satisfaction !== null && ui.draft.acompanamiento !== null &&
      ui.draft.calidad_contenido !== null && ui.draft.aplicabilidad !== null;

    return (
      '<div>' +
        renderNotice() +

        '<div class="section-block">' +
          '<div class="section-eyebrow"><span class="num">01</span><span class="label">Tu satisfacción</span></div>' +
          '<div class="form-card">' +
            '<div class="q-block" style="margin-bottom:0">' +
              '<p class="q-label">¿Qué tanto te gustó la sesión?</p>' +
              '<p class="q-hint">Escala de 0 a 10</p>' +
              '<div class="scale-row">' + scaleButtons('satisfaction', 0, 10, zoneOf) + '</div>' +
              '<div class="scale-endcaps"><span>Nada</span><span>Muchísimo</span></div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="section-block">' +
          '<div class="section-eyebrow"><span class="num">02</span><span class="label">Cómo estuvo la sesión</span></div>' +
          '<div class="form-card">' +
            '<div class="q-block">' +
              '<p class="q-label">Acompañamiento del equipo de MyworkIn</p>' +
              '<p class="q-hint">Escala de 1 a 5</p>' +
              '<div class="scale-row">' + scaleButtons('acompanamiento', 1, 5, null) + '</div>' +
              '<div class="scale-endcaps"><span>Muy malo</span><span>Excelente</span></div>' +
            '</div>' +
            '<div class="q-block">' +
              '<p class="q-label">Calidad del contenido presentado</p>' +
              '<p class="q-hint">Escala de 1 a 5</p>' +
              '<div class="scale-row">' + scaleButtons('calidad_contenido', 1, 5, null) + '</div>' +
              '<div class="scale-endcaps"><span>Muy malo</span><span>Excelente</span></div>' +
            '</div>' +
            '<div class="q-block" style="margin-bottom:0">' +
              '<p class="q-label">Qué tan aplicable fue a tu rol o área</p>' +
              '<p class="q-hint">Escala de 1 a 5</p>' +
              '<div class="scale-row">' + scaleButtons('aplicabilidad', 1, 5, null) + '</div>' +
              '<div class="scale-endcaps"><span>Nada aplicable</span><span>Muy aplicable</span></div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="section-block">' +
          '<div class="section-eyebrow"><span class="num">03</span><span class="label">Cuéntanos más</span></div>' +
          '<div class="form-card">' +
            openField('aprendizaje', '¿Cuál fue el mayor aprendizaje o el momento más útil de la sesión?', 'Opcional', 'Escribe aquí...') +
            openField('caso_uso', '¿Qué caso de uso te gustaría aplicar primero en tu trabajo?', 'Opcional', 'Escribe aquí...') +
            openField('mejora', '¿Qué cambiarías o mejorarías para la próxima sesión?', 'Opcional', 'Escribe aquí...', true) +
          '</div>' +
        '</div>' +

        '<div class="form-footer">' +
          (canSubmit ? '<span></span>' : '<p class="field-error">Responde las 4 preguntas de escala para poder enviar.</p>') +
          '<button type="button" class="btn-submit" data-action="submit"' + (ui.submitting ? ' disabled' : '') + '>' + (ui.submitting ? 'Enviando…' : 'Enviar respuesta') + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function paint() {
    document.getElementById('root').innerHTML =
      '<div class="page">' +
        renderHeader() +
        (ui.submitted ? renderThankYou() : renderForm()) +
        '<footer class="page-footer">' +
          '<p>Escala de satisfacción: 9–10 muy satisfecho · 7–8 neutral · 0–6 insatisfecho.</p>' +
          '<p>Encuesta generada por MyworkIn.</p>' +
        '</footer>' +
      '</div>';
  }

  function setNotice(kind, icon, text) {
    ui.notice = { kind: kind, icon: icon, text: text };
  }

  function clearNoticeSoon() {
    setTimeout(function () { ui.notice = null; paint(); }, 4000);
  }

  function freshDraft() {
    return { satisfaction: null, acompanamiento: null, calidad_contenido: null, aplicabilidad: null, aprendizaje: '', caso_uso: '', mejora: '' };
  }

  async function handleSubmit() {
    if (ui.draft.satisfaction === null || ui.draft.acompanamiento === null ||
        ui.draft.calidad_contenido === null || ui.draft.aplicabilidad === null) {
      paint();
      return;
    }
    ui.submitting = true;
    paint();

    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/nps_responses', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          satisfaction: ui.draft.satisfaction,
          acompanamiento: ui.draft.acompanamiento,
          calidad_contenido: ui.draft.calidad_contenido,
          aplicabilidad: ui.draft.aplicabilidad,
          aprendizaje: ui.draft.aprendizaje.trim() || null,
          caso_uso: ui.draft.caso_uso.trim() || null,
          mejora: ui.draft.mejora.trim() || null
        })
      });
      if (!res.ok) throw new Error('http ' + res.status);
      ui.submitting = false;
      ui.submitted = true;
      paint();
    } catch (err) {
      ui.submitting = false;
      setNotice('err', '⚠️', 'No se pudo guardar. Intenta de nuevo en unos segundos.');
      paint();
      clearNoticeSoon();
    }
  }

  function init() {
    paint();

    var root = document.getElementById('root');

    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-action]');
      if (!el) return;
      var action = el.getAttribute('data-action');

      if (action === 'pick') {
        var field = el.getAttribute('data-field');
        var value = parseInt(el.getAttribute('data-value'), 10);
        ui.draft[field] = value;
        paint();
      } else if (action === 'submit') {
        handleSubmit();
      } else if (action === 'again') {
        ui.submitted = false;
        ui.draft = freshDraft();
        paint();
      }
    });

    root.addEventListener('input', function (e) {
      if (e.target.matches('textarea[data-role="open"]')) {
        ui.draft[e.target.getAttribute('data-field')] = e.target.value;
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
