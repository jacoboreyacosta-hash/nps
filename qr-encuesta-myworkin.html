<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Código QR · Encuesta de Satisfacción</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F3F6FA;
    --surface-3: #EAEFF5;
    --border: #E2E8F0;
    --ink: #101826;
    --ink-muted: #5B6B80;
    --ink-faint: #8394A8;
    --accent: #0072D6;
    --accent-soft: rgba(0,114,214,0.08);
    --good: #12A578;
    --good-soft: rgba(18,165,120,0.12);
    --shadow: 0 1px 2px rgba(16,24,38,0.04), 0 20px 48px -24px rgba(16,24,38,0.14);
    --font-display: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  /* Fondo blanco fijo, sin variante oscura — consistente con la encuesta. */

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  @media (max-width: 480px) { .page { padding: 44px 18px 56px; } }

  .brand-logo {
    height: 30px; width: 148px;
    background-image: url("/assets/myworkin-logo.png");
    background-size: contain; background-repeat: no-repeat; background-position: center;
    margin-bottom: 36px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    text-wrap: balance;
  }

  .subtitle {
    font-size: 16px;
    color: var(--ink-muted);
    margin: 0 0 40px;
    max-width: 400px;
    text-wrap: balance;
  }

  .qr-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }

  .qr-card img {
    display: block;
    width: 280px;
    height: 280px;
    border-radius: 4px;
  }

  .scan-hint {
    font-size: 14px;
    color: var(--ink-faint);
    margin: 0 0 32px;
  }

  .link-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  .link-row input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-muted);
    outline: none;
    min-width: 0;
  }

  .copy-btn {
    flex: none;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .copy-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px -6px rgba(0,114,214,0.5); }
  .copy-btn:active { transform: translateY(0); }
  .copy-btn.copied { background: var(--good); }

  .footnote {
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="brand-logo" role="img" aria-label="MyworkIn"></div>
    <div class="eyebrow">Claude Training</div>
    <h1>Escanea para responder</h1>
    <p class="subtitle">Este código lleva directo a la Encuesta de Satisfacción. Toma menos de 2 minutos.</p>

    <div class="qr-card">
      <img src="/assets/encuesta-qr.png" alt="Código QR de la Encuesta de Satisfacción">
    </div>
    <p class="scan-hint">Apunta la cámara de tu celular al código</p>

    <div class="link-row">
      <input id="link-input" type="text" readonly value="https://nps-ruby.vercel.app">
      <button class="copy-btn" id="copy-btn" type="button">Copiar</button>
    </div>
    <p class="footnote">O comparte este enlace directamente.</p>
  </div>

  <script>
    var btn = document.getElementById('copy-btn');
    var input = document.getElementById('link-input');
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(input.value).then(function () {
        var original = btn.textContent;
        btn.textContent = 'Copiado';
        btn.classList.add('copied');
        setTimeout(function () {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1800);
      });
    });
  </script>
</body>
</html>
