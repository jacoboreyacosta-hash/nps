<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados de Satisfacción · Claude Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F3F6FA;
    --surface-3: #EAEFF5;
    --border: #E2E8F0;
    --ink: #101826;
    --ink-muted: #5B6B80;
    --ink-faint: #8394A8;
    --accent: #0072D6;
    --accent-strong: #0072D6;
    --accent-soft: rgba(0,114,214,0.08);
    --on-status: rgba(10,14,20,0.86);
    --on-critical: #FFFFFF;
    --good: #12A578;
    --good-soft: rgba(18,165,120,0.12);
    --warning: #C97A0A;
    --warning-soft: rgba(201,122,10,0.12);
    --critical: #D6304B;
    --critical-soft: rgba(214,48,75,0.10);
    --shadow: 0 1px 2px rgba(16,24,38,0.04), 0 20px 48px -24px rgba(16,24,38,0.14);
    --font-display: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  /* Fondo blanco fijo — sin variante oscura, sin importar el tema del sistema o del visor. */

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  button, input { font-family: inherit; color: inherit; }

  .page { max-width: 880px; margin: 0 auto; padding: 56px 24px 80px; }
  @media (max-width: 560px) { .page { padding: 36px 16px 56px; } }

  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
  .brand-mark { display: inline-flex; align-items: center; }
  .brand-logo { height: 26px; width: 128px; display: block; background-image: url("/assets/myworkin-logo.png"); background-size: contain; background-repeat: no-repeat; background-position: left center; }

  .privacy-chip {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em;
    color: var(--warning); background: var(--warning-soft); border: 1px solid var(--warning);
    padding: 5px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  }

  h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em; }
  .subtitle { margin: 0 0 36px; font-size: 15px; color: var(--ink-muted); }

  /* ---- gate ---- */

  .gate-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px;
    box-shadow: var(--shadow); max-width: 420px;
  }
  .gate-card p.hint { margin: 0 0 18px; font-size: 14px; color: var(--ink-muted); }
  .gate-row { display: flex; gap: 8px; }
  .gate-row input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; font-size: 14.5px; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .gate-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
  .gate-btn {
    flex: none; border: none; background: var(--accent-strong); color: #fff; font-weight: 700; font-size: 14px;
    padding: 0 20px; border-radius: 10px; cursor: pointer; transition: filter 0.15s ease, transform 0.12s ease;
  }
  .gate-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .gate-error { margin: 12px 0 0; font-size: 13px; color: var(--critical); }

  /* ---- stats ---- */

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px; }
  @media (max-width: 640px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px 18px;
    box-shadow: var(--shadow);
  }
  .stat-label { font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; }
  .stat-value { font-family: var(--font-mono); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat-value .unit { font-size: 15px; color: var(--ink-faint); font-weight: 500; }

  .section-title { display: flex; align-items: center; gap: 12px; margin: 40px 0 16px; }
  .section-title h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px; box-shadow: var(--shadow); }

  .dist-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .dist-row:last-child { margin-bottom: 0; }
  .dist-label { flex: none; width: 26px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink-muted); text-align: right; }
  .dist-track { flex: 1; height: 20px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .dist-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.4s ease; }
  .dist-count { flex: none; width: 30px; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .legend-note { margin: 14px 0 0; font-size: 12px; color: var(--ink-faint); }

  .comments-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .comments-grid { grid-template-columns: 1fr; } }
  .comment-col h3 { font-size: 13px; font-weight: 700; color: var(--ink-muted); margin: 0 0 12px; }
  .comment-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    font-size: 13.5px; line-height: 1.55; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .comment-empty { font-size: 13px; color: var(--ink-faint); font-style: italic; }

  .responses-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  table.responses-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.responses-table th, table.responses-table td { padding: 10px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  table.responses-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); background: var(--surface-2); }
  table.responses-table td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  table.responses-table tr:last-child td { border-bottom: none; }

  .empty-state { text-align: center; padding: 60px 24px; color: var(--ink-muted); }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

  footer.page-footer { padding-top: 24px; border-top: 1px solid var(--border); margin-top: 44px; }
  footer.page-footer p { margin: 0 0 6px; font-size: 12px; color: var(--ink-faint); font-family: var(--font-mono); line-height: 1.6; }

  .refresh-btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-muted); font-weight: 600; font-size: 12.5px;
    padding: 8px 14px; border-radius: 9px; cursor: pointer; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .refresh-btn:hover { color: var(--ink); border-color: var(--accent); }
</style>
</head>
<body>

<div id="root"></div>

<script>
(function () {
  var SUPABASE_URL = 'https://bwlvobtbhcjoscinqfhq.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3bHZvYnRiaGNqb3NjaW5xZmhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMDUyNDUsImV4cCI6MjEwMDc4MTI0NX0.FtpV3bxY7V9-ZtNQStscEFfSJzjFJ3iN_3yKBEbqgKU';

  var state = { unlocked: false, password: '', loading: false, error: '', rows: null };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderHeader() {
    return (
      '<div class="brand-row">' +
        '<span class="brand-mark"><span class="brand-logo" role="img" aria-label="MyworkIn"></span></span>' +
        '<span class="privacy-chip">🔒 Privado — solo tú</span>' +
      '</div>' +
      '<h1>Resultados de Satisfacción</h1>' +
      '<p class="subtitle">Claude Training</p>'
    );
  }

  function renderGate() {
    return (
      '<div class="gate-card">' +
        '<p class="hint">Ingresa la contraseña de resultados para ver las respuestas.</p>' +
        '<div class="gate-row">' +
          '<input id="pw-input" type="password" placeholder="Contraseña" autocomplete="off">' +
          '<button class="gate-btn" id="pw-btn" type="button">' + (state.loading ? 'Entrando…' : 'Entrar') + '</button>' +
        '</div>' +
        (state.error ? '<p class="gate-error">' + esc(state.error) + '</p>' : '') +
      '</div>'
    );
  }

  function avg(rows, field) {
    if (!rows.length) return null;
    var sum = 0;
    for (var i = 0; i < rows.length; i++) sum += rows[i][field];
    return sum / rows.length;
  }

  function fmt1(n) {
    return n == null ? '—' : (Math.round(n * 10) / 10).toFixed(1);
  }

  function distribution(rows, field, min, max) {
    var counts = {};
    for (var v = min; v <= max; v++) counts[v] = 0;
    rows.forEach(function (r) { counts[r[field]] = (counts[r[field]] || 0) + 1; });
    return counts;
  }

  function renderDist(rows, field, min, max) {
    var counts = distribution(rows, field, min, max);
    var maxCount = Math.max.apply(null, Object.keys(counts).map(function (k) { return counts[k]; }).concat([1]));
    var out = '';
    for (var v = max; v >= min; v--) {
      var c = counts[v];
      var pct = Math.round((c / maxCount) * 100);
      out += (
        '<div class="dist-row">' +
          '<span class="dist-label">' + v + '</span>' +
          '<div class="dist-track"><div class="dist-fill" style="width:' + pct + '%"></div></div>' +
          '<span class="dist-count">' + c + '</span>' +
        '</div>'
      );
    }
    return out;
  }

  function commentCol(rows, field, title) {
    var items = rows.map(function (r) { return r[field]; }).filter(function (t) { return t && t.trim(); });
    var html = '<div class="comment-col"><h3>' + esc(title) + '</h3>';
    if (!items.length) {
      html += '<p class="comment-empty">Sin comentarios todavía.</p>';
    } else {
      items.slice(0, 12).forEach(function (t) {
        html += '<div class="comment-card">' + esc(t) + '</div>';
      });
    }
    return html + '</div>';
  }

  function renderResults() {
    var rows = state.rows;

    if (!rows.length) {
      return (
        '<div class="empty-state">' +
          '<div class="icon">📊</div>' +
          '<p><strong>Todavía no hay respuestas.</strong></p>' +
          '<p>En cuanto la gente empiece a responder la encuesta, actualiza esta página.</p>' +
        '</div>'
      );
    }

    var avgSat = avg(rows, 'satisfaction');
    var avgAcomp = avg(rows, 'acompanamiento');
    var avgCont = avg(rows, 'calidad_contenido');
    var avgApli = avg(rows, 'aplicabilidad');

    return (
      '<div class="stat-grid">' +
        '<div class="stat-card"><p class="stat-label">Respuestas</p><p class="stat-value">' + rows.length + '</p></div>' +
        '<div class="stat-card"><p class="stat-label">Satisfacción</p><p class="stat-value">' + fmt1(avgSat) + '<span class="unit"> /10</span></p></div>' +
        '<div class="stat-card"><p class="stat-label">Acompañamiento</p><p class="stat-value">' + fmt1(avgAcomp) + '<span class="unit"> /5</span></p></div>' +
        '<div class="stat-card"><p class="stat-label">Contenido</p><p class="stat-value">' + fmt1(avgCont) + '<span class="unit"> /5</span></p></div>' +
      '</div>' +

      '<div class="section-title"><h2>Distribución de satisfacción</h2></div>' +
      '<div class="chart-card">' +
        renderDist(rows, 'satisfaction', 0, 10) +
        '<p class="legend-note">Escala: 9–10 muy satisfecho · 7–8 neutral · 0–6 insatisfecho. Aplicabilidad promedio: ' + fmt1(avgApli) + ' /5.</p>' +
      '</div>' +

      '<div class="section-title"><h2>Comentarios</h2></div>' +
      '<div class="comments-grid">' +
        commentCol(rows, 'aprendizaje', 'Mayor aprendizaje') +
        commentCol(rows, 'caso_uso', 'Caso de uso a aplicar') +
        commentCol(rows, 'mejora', 'Qué mejorarían') +
      '</div>' +

      '<div class="section-title"><h2>Todas las respuestas</h2></div>' +
      '<div class="responses-table-wrap"><table class="responses-table"><thead><tr>' +
        '<th>Fecha</th><th>Satisf.</th><th>Acomp.</th><th>Conten.</th><th>Aplic.</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (r) {
        var d = new Date(r.created_at);
        var dstr = d.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        return '<tr><td>' + dstr + '</td><td>' + r.satisfaction + '</td><td>' + r.acompanamiento + '</td><td>' + r.calidad_contenido + '</td><td>' + r.aplicabilidad + '</td></tr>';
      }).join('') +
      '</tbody></table></div>' +

      '<div class="section-title"><h2>Actualizar</h2></div>' +
      '<button class="refresh-btn" id="refresh-btn" type="button">↻ Recargar respuestas</button>'
    );
  }

  function paint() {
    document.getElementById('root').innerHTML =
      '<div class="page">' +
        renderHeader() +
        (state.unlocked ? (state.rows ? renderResults() : '<p class="subtitle">Cargando…</p>') : renderGate()) +
        '<footer class="page-footer">' +
          '<p>Página privada de resultados, generada por MyworkIn. No la compartas — la encuesta pública no tiene acceso a esto.</p>' +
        '</footer>' +
      '</div>';
    wire();
  }

  async function fetchResults() {
    state.rows = null;
    paint();
    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_nps_results', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_password: state.password })
      });
      if (!res.ok) throw new Error('http ' + res.status);
      state.rows = await res.json();
      paint();
    } catch (err) {
      state.unlocked = false;
      state.error = 'Contraseña incorrecta o error de conexión.';
      paint();
    }
  }

  function tryUnlock() {
    var input = document.getElementById('pw-input');
    var pw = input ? input.value : '';
    if (!pw) return;
    state.password = pw;
    state.loading = true;
    state.error = '';
    paint();
    state.unlocked = true;
    state.loading = false;
    fetchResults();
  }

  function wire() {
    var btn = document.getElementById('pw-btn');
    if (btn) {
      btn.addEventListener('click', tryUnlock);
    }
    var input = document.getElementById('pw-input');
    if (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') tryUnlock();
      });
      input.focus();
    }
    var refreshBtn = document.getElementById('refresh-btn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', fetchResults);
    }
  }

  paint();
})();
</script>
</body>
</html>
